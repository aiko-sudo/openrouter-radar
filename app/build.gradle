plugins { id 'com.android.application' }
android {
    namespace 'app.openrouter.radar'
    compileSdk 36
    defaultConfig {
        applicationId 'app.openrouter.radar'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.6.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def ks = rootProject.file('keystore.jks')
    if (ks.exists()) {
        signingConfigs {
            release {
                storeFile ks
                storePassword System.getenv('RADAR_KS_PASS') ?: 'android'
                keyAlias 'radar'
                keyPassword System.getenv('RADAR_KEY_PASS') ?: 'android'
            }
        }
        buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    } else {
        buildTypes { release { minifyEnabled false } }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
        }
    }
}
configurations.all { resolutionStrategy { force 'org.conscrypt:conscrypt-openjdk-uber:2.7.0' } }
dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation('org.conscrypt:conscrypt-openjdk-uber:2.7.0') { transitive = false }
}
